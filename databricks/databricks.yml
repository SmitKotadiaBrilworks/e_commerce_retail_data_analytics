# Databricks Asset Bundle — deploys the notebooks + a serverless job that runs the pipeline.
# Works on Free Edition (serverless only).
#
#   pip install databricks-cli            # or: brew install databricks
#   databricks configure --token          # host + PAT
#   cd databricks
#   databricks bundle deploy -t dev
#   databricks bundle run elecmart_pipeline -t dev
#
# The dashboard is deployed too; open it from Workspace ▸ (bundle path) ▸ dashboards.
#
# Job DAG: bronze (notebook) -> silver+gold (Lakeflow Declarative Pipeline) -> data quality
# (notebook, now checking pipeline-owned tables) -> dashboard refresh. The pipeline_id below
# points at the existing "Elecmart Medallion Pipeline (Bronze -> Silver -> Gold)" pipeline
# (source backed up in lakeflow_pipeline/) rather than a bundle-managed pipeline resource,
# since it was built via the workspace AI Assistant and already owns elecmart.silver.*/gold.*.

bundle:
  name: elecmart

targets:
  dev:
    mode: development
    default: true
    workspace:
      # host: https://<your-workspace>.cloud.databricks.com   # or set DATABRICKS_HOST

resources:
  jobs:
    elecmart_pipeline:
      name: elecmart_pipeline
      # serverless: no job_clusters block => tasks run on serverless compute
      max_concurrent_runs: 1
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: notebooks/00_setup.sql
        - task_key: bronze
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: notebooks/01_bronze.sql
        - task_key: silver_gold_pipeline
          depends_on: [{ task_key: bronze }]
          pipeline_task:
            pipeline_id: e4af073c-17f9-4de5-98ee-ce62b949f0e0
        - task_key: data_quality
          depends_on: [{ task_key: silver_gold_pipeline }]
          notebook_task:
            notebook_path: notebooks/05_data_quality.sql
        - task_key: dashboard_refresh
          depends_on: [{ task_key: data_quality }]
          dashboard_task:
            dashboard_id: ${resources.dashboards.elecmart_dashboard.id}
            warehouse_id: f451ef9cb1ca46e5

  dashboards:
    elecmart_dashboard:
      display_name: Elecmart Retail Analytics
      file_path: dashboards/elecmart_retail_analytics.lvdash.json
      warehouse_id: f451ef9cb1ca46e5
